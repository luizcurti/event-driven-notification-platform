<svg viewBox="0 0 1400 1010" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,60 L10,65 L0,70 z" fill="#687078"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1400" height="1010" fill="#FFFFFF"/>

  <text x="700" y="34" text-anchor="middle" font-size="22" font-weight="bold" fill="#232F3E">Event-Driven Notification Platform — AWS Architecture (High-Level)</text>

  <!-- ===================== SOLID EDGES ===================== -->
  <g stroke="#687078" stroke-width="2" fill="none">
    <path d="M92,190 L175,190" marker-end="url(#arrow)"/>                                  <!-- client -> waf -->
    <path d="M245,190 L345,190" marker-end="url(#arrow)"/>                                 <!-- waf -> apigw -->
    <path d="M415,190 L525,190" marker-end="url(#arrow)"/>                                 <!-- apigw -> notification-api -->
    <path d="M595,190 L705,190" marker-end="url(#arrow)"/>                                 <!-- notification-api -> eventbridge -->
    <path d="M775,170 L830,170 L830,120 L885,120" marker-end="url(#arrow)"/>                  <!-- eventbridge -> email -->
    <path d="M775,190 L830,190 L830,240 L885,240" marker-end="url(#arrow)"/>                <!-- eventbridge -> sms -->
    <path d="M775,210 L830,210 L830,360 L885,360" marker-end="url(#arrow)"/>                <!-- eventbridge -> push -->
    <path d="M955,120 L1030,120 L1030,240 L1065,240" marker-end="url(#arrow)"/>                <!-- email -> dynamodb -->
    <path d="M955,240 L1065,240" marker-end="url(#arrow)"/>                                 <!-- sms -> dynamodb -->
    <path d="M955,360 L1030,360 L1030,240 L1065,240" marker-end="url(#arrow)"/>              <!-- push -> dynamodb -->
    <path d="M955,520 L1065,520" marker-end="url(#arrow)"/>                                 <!-- retry-queue -> retry-worker -->
    <path d="M1135,520 L1250,520 L1250,190 L795,190" marker-end="url(#arrow)"/>              <!-- retry-worker -> eventbridge -->
  </g>

  <!-- ===================== DASHED (FAILURE) EDGES ===================== -->
  <g stroke="#C7102E" stroke-width="2" fill="none" stroke-dasharray="6,4">
    <path d="M885,120 L800,120 L800,520 L885,520" marker-end="url(#arrow)"/>                  <!-- email -> retry-queue -->
    <path d="M885,240 L800,240 L800,520 L885,520" marker-end="url(#arrow)"/>                <!-- sms -> retry-queue -->
    <path d="M885,360 L800,360 L800,520 L885,520" marker-end="url(#arrow)"/>                <!-- push -> retry-queue -->
    <path d="M920,555 L920,625" marker-end="url(#arrow)"/>                                  <!-- retry-queue -> dlq -->
  </g>

  <!-- ===================== EDGE LABELS ===================== -->
  <g font-size="10.5" fill="#232F3E">
    <text x="185" y="180">rate limiting</text>
    <text x="425" y="180">POST / GET / DELETE</text>
    <text x="608" y="180">publish event</text>
    <text x="1000" y="95" font-weight="bold">route by detail-type (eventType)</text>
    <text x="962" y="205">update channelState</text>
    <text x="810" y="465" fill="#C7102E">on send failure</text>
    <text x="965" y="513">consume</text>
    <text x="1170" y="350">republish NotificationRequested</text>
    <text x="1170" y="364">(retryCount &#8804; MAX_RETRIES)</text>
    <text x="928" y="590" fill="#C7102E">max retries</text>
    <text x="928" y="604" fill="#C7102E">(SQS redrive policy)</text>
  </g>

  <!-- ===================== NODES ===================== -->

  <!-- Client -->
  <circle cx="60" cy="190" r="32" fill="#545B64"/>
  <circle cx="60" cy="180" r="6.5" fill="#FFFFFF"/>
  <path d="M46,206 Q60,188 74,206 L74,214 Q60,201 46,214 Z" fill="#FFFFFF"/>
  <text x="60" y="240" text-anchor="middle" font-size="13" font-weight="bold" fill="#232F3E">Client</text>
  <text x="60" y="256" text-anchor="middle" font-size="10" fill="#687078">users / apps</text>

  <!-- WAF -->
  <rect x="175" y="155" width="70" height="70" rx="12" fill="#DD344C"/>
  <text x="210" y="197" text-anchor="middle" font-size="15" font-weight="bold" fill="#FFFFFF">WAF</text>
  <text x="210" y="243" text-anchor="middle" font-size="13" font-weight="bold" fill="#232F3E">AWS WAF</text>
  <text x="210" y="259" text-anchor="middle" font-size="10" fill="#687078">edge protection</text>

  <!-- API Gateway -->
  <rect x="345" y="155" width="70" height="70" rx="12" fill="#E7157B"/>
  <text x="380" y="197" text-anchor="middle" font-size="16" font-weight="bold" fill="#FFFFFF">API</text>
  <text x="380" y="243" text-anchor="middle" font-size="13" font-weight="bold" fill="#232F3E">API Gateway</text>
  <text x="380" y="259" text-anchor="middle" font-size="10" fill="#687078">API key auth</text>

  <!-- notification-api Lambda -->
  <rect x="525" y="155" width="70" height="70" rx="12" fill="#ED7100"/>
  <text x="560" y="200" text-anchor="middle" font-size="22" font-weight="bold" fill="#FFFFFF">&#955;</text>
  <text x="560" y="243" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#232F3E">notification-api &#955;</text>
  <text x="560" y="259" text-anchor="middle" font-size="10" fill="#687078">create / list / get / cancel</text>

  <!-- EventBridge -->
  <rect x="705" y="155" width="70" height="70" rx="12" fill="#E7157B"/>
  <text x="740" y="197" text-anchor="middle" font-size="15" font-weight="bold" fill="#FFFFFF">EB</text>
  <text x="740" y="243" text-anchor="middle" font-size="13" font-weight="bold" fill="#232F3E">EventBridge</text>
  <text x="740" y="259" text-anchor="middle" font-size="10" fill="#687078">fan-out by rule</text>

  <!-- email Lambda -->
  <rect x="885" y="85" width="70" height="70" rx="12" fill="#ED7100"/>
  <text x="920" y="130" text-anchor="middle" font-size="22" font-weight="bold" fill="#FFFFFF">&#955;</text>
  <text x="920" y="173" text-anchor="middle" font-size="12" font-weight="bold" fill="#232F3E">email &#955;</text>
  <text x="920" y="189" text-anchor="middle" font-size="10" fill="#687078">EMAIL channel</text>

  <!-- sms Lambda -->
  <rect x="885" y="205" width="70" height="70" rx="12" fill="#ED7100"/>
  <text x="920" y="250" text-anchor="middle" font-size="22" font-weight="bold" fill="#FFFFFF">&#955;</text>
  <text x="920" y="293" text-anchor="middle" font-size="12" font-weight="bold" fill="#232F3E">sms &#955;</text>
  <text x="920" y="309" text-anchor="middle" font-size="10" fill="#687078">SMS channel</text>

  <!-- push Lambda -->
  <rect x="885" y="325" width="70" height="70" rx="12" fill="#ED7100"/>
  <text x="920" y="370" text-anchor="middle" font-size="22" font-weight="bold" fill="#FFFFFF">&#955;</text>
  <text x="920" y="413" text-anchor="middle" font-size="12" font-weight="bold" fill="#232F3E">push &#955;</text>
  <text x="920" y="429" text-anchor="middle" font-size="10" fill="#687078">PUSH channel</text>

  <!-- DynamoDB -->
  <rect x="1065" y="205" width="70" height="70" rx="12" fill="#4D72F3"/>
  <text x="1100" y="250" text-anchor="middle" font-size="15" font-weight="bold" fill="#FFFFFF">DDB</text>
  <text x="1100" y="293" text-anchor="middle" font-size="13" font-weight="bold" fill="#232F3E">DynamoDB</text>
  <text x="1100" y="309" text-anchor="middle" font-size="10" fill="#687078">notifications table</text>

  <!-- Retry Queue -->
  <rect x="885" y="485" width="70" height="70" rx="12" fill="#E7157B"/>
  <text x="920" y="527" text-anchor="middle" font-size="15" font-weight="bold" fill="#FFFFFF">SQS</text>
  <text x="920" y="573" text-anchor="middle" font-size="12" font-weight="bold" fill="#232F3E">Retry Queue</text>
  <text x="920" y="589" text-anchor="middle" font-size="10" fill="#687078">per-channel retry</text>

  <!-- retry-worker Lambda -->
  <rect x="1065" y="485" width="70" height="70" rx="12" fill="#ED7100"/>
  <text x="1100" y="530" text-anchor="middle" font-size="22" font-weight="bold" fill="#FFFFFF">&#955;</text>
  <text x="1100" y="573" text-anchor="middle" font-size="12" font-weight="bold" fill="#232F3E">retry-worker &#955;</text>
  <text x="1100" y="589" text-anchor="middle" font-size="10" fill="#687078">MAX_RETRIES=3</text>

  <!-- DLQ -->
  <rect x="885" y="625" width="70" height="70" rx="12" fill="#C7102E"/>
  <text x="920" y="667" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">DLQ</text>
  <text x="920" y="713" text-anchor="middle" font-size="13" font-weight="bold" fill="#232F3E">SQS DLQ</text>
  <text x="920" y="729" text-anchor="middle" font-size="10" fill="#687078">infra-level failures</text>

  <!-- ===================== LEGEND ===================== -->
  <g font-size="12" fill="#232F3E">
    <rect x="20" y="760" width="300" height="215" rx="8" fill="#F8F8F8" stroke="#E1E4E8"/>
    <text x="36" y="785" font-size="13" font-weight="bold" fill="#232F3E">Legend</text>

    <rect x="36" y="798" width="16" height="16" rx="3" fill="#ED7100"/>
    <text x="60" y="811">Compute (Lambda)</text>

    <rect x="36" y="822" width="16" height="16" rx="3" fill="#4D72F3"/>
    <text x="60" y="835">Database (DynamoDB)</text>

    <rect x="36" y="846" width="16" height="16" rx="3" fill="#E7157B"/>
    <text x="60" y="859">App Integration</text>

    <rect x="36" y="870" width="16" height="16" rx="3" fill="#DD344C"/>
    <text x="60" y="883">Security (WAF)</text>

    <rect x="36" y="894" width="16" height="16" rx="3" fill="#C7102E"/>
    <text x="60" y="907">Dead Letter Queue</text>

    <line x1="36" y1="923" x2="66" y2="923" stroke="#687078" stroke-width="2"/>
    <text x="72" y="927" font-size="11">main flow</text>

    <line x1="36" y1="938" x2="66" y2="938" stroke="#C7102E" stroke-width="2" stroke-dasharray="6,4"/>
    <text x="72" y="942" font-size="11">failure path</text>
  </g>
</svg>
