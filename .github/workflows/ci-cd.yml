name: CI-CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Dependency Security Audit
        run: npm audit --audit-level=high

      - name: Format Check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit Tests
        run: npm run test:unit

      - name: Integration Tests
        run: npm run test:integration

      - name: Build
        run: npm run build

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Terraform Format Check
        run: terraform -chdir=terraform fmt -check -recursive

      - name: Terraform Validate
        run: |
          cd terraform
          terraform init -backend=false
          terraform validate

      - name: Setup tflint
        uses: terraform-linters/setup-tflint@v4

      - name: Terraform Lint (tflint)
        working-directory: terraform
        run: |
          tflint --init
          tflint --recursive

      - name: Terraform Static Analysis (checkov)
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: terraform
          config_file: terraform/.checkov.yaml
          quiet: true
          soft_fail: false

  e2e-localstack:
    runs-on: ubuntu-latest
    needs: validate
    env:
      LOCALSTACK_PROFILE: e2e-localstack
      LOCALSTACK_ENDPOINT: http://localhost:4566
      API_KEY_VALUE: ci-dev-key-1234567890
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Start LocalStack (Dedicated Profile)
        run: docker compose -f docker-compose.localstack.yml --profile e2e-localstack up -d

      - name: Wait for LocalStack Health
        run: curl -fsS http://localhost:4566/_localstack/health --retry 60 --retry-delay 2 --retry-all-errors --retry-connrefused > /dev/null

      - name: Run E2E Tests
        run: npm run test:e2e

      - name: E2E Coverage Gate
        run: npm run test:e2e:coverage

      - name: Build and Package Lambda zip
        run: |
          npm run build
          cd dist && zip -rq lambdas.zip .

      - name: Deploy to LocalStack via Terraform
        working-directory: terraform
        run: |
          terraform init -input=false
          terraform apply -auto-approve -input=false \
            -var="use_localstack=true" \
            -var="localstack_endpoint=${{ env.LOCALSTACK_ENDPOINT }}" \
            -var="api_key_value=${{ env.API_KEY_VALUE }}"

      - name: API/Collection Tests (Postman via newman)
        run: |
          API_ID=$(terraform -chdir=terraform output -raw api_url | sed -E 's#https?://([^.]+)\..*#\1#')
          API_URL="http://${API_ID}.execute-api.localhost.localstack.cloud:4566/prod"
          npx --yes newman@6.2.2 run postman/event-driven-notification-platform.postman_collection.json \
            --env-var "apiUrl=${API_URL}" \
            --env-var "apiKey=${{ env.API_KEY_VALUE }}" \
            --delay-request 200

      - name: Destroy Terraform-managed LocalStack Resources
        if: always()
        working-directory: terraform
        run: |
          terraform destroy -auto-approve -input=false \
            -var="use_localstack=true" \
            -var="localstack_endpoint=${{ env.LOCALSTACK_ENDPOINT }}" \
            -var="api_key_value=${{ env.API_KEY_VALUE }}"

      - name: Stop LocalStack
        if: always()
        run: docker compose -f docker-compose.localstack.yml --profile e2e-localstack down --remove-orphans

  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [validate, e2e-localstack]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Terraform Validate
        run: |
          cd terraform
          terraform init -backend=false
          terraform validate
