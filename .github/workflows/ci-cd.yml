name: CI-CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Dependency Security Audit
        run: npm audit --audit-level=high

      - name: Format Check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit Tests
        run: npm run test:unit

      - name: Integration Tests
        run: npm run test:integration

      - name: Build
        run: npm run build

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Terraform Format Check
        run: terraform -chdir=terraform fmt -check -recursive

      - name: Terraform Validate
        run: |
          cd terraform
          terraform init -backend=false
          terraform validate

      - name: Terraform Format Check + Validate (bootstrap)
        run: |
          terraform -chdir=bootstrap fmt -check -recursive
          terraform -chdir=bootstrap init -backend=false
          terraform -chdir=bootstrap validate

      - name: Setup tflint
        uses: terraform-linters/setup-tflint@v4

      - name: Terraform Lint (tflint)
        working-directory: terraform
        run: |
          tflint --init
          tflint --recursive

      - name: Terraform Static Analysis (checkov)
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: terraform
          config_file: terraform/.checkov.yaml
          quiet: true
          soft_fail: false

  e2e-localstack:
    runs-on: ubuntu-latest
    needs: validate
    env:
      LOCALSTACK_PROFILE: e2e-localstack
      LOCALSTACK_ENDPOINT: http://localhost:4566
      API_KEY_VALUE: ci-dev-key-1234567890
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Start LocalStack (Dedicated Profile)
        run: docker compose -f docker-compose.localstack.yml --profile e2e-localstack up -d

      - name: Wait for LocalStack Health
        run: curl -fsS http://localhost:4566/_localstack/health --retry 60 --retry-delay 2 --retry-all-errors --retry-connrefused > /dev/null

      - name: Run E2E Tests
        run: npm run test:e2e

      - name: E2E Coverage Gate
        run: npm run test:e2e:coverage

      - name: Build and Package Lambda zip
        run: |
          npm run build
          cd dist && zip -rq lambdas.zip .

      - name: Deploy to LocalStack via Terraform
        working-directory: terraform
        run: |
          terraform init -input=false
          terraform apply -auto-approve -input=false \
            -var="use_localstack=true" \
            -var="localstack_endpoint=${{ env.LOCALSTACK_ENDPOINT }}" \
            -var="api_key_value=${{ env.API_KEY_VALUE }}"

      - name: API/Collection Tests (Postman via newman)
        run: |
          API_ID=$(terraform -chdir=terraform output -raw api_url | sed -E 's#https?://([^.]+)\..*#\1#')
          API_URL="http://${API_ID}.execute-api.localhost.localstack.cloud:4566/prod"
          npx --yes newman@6.2.2 run postman/event-driven-notification-platform.postman_collection.json \
            --env-var "apiUrl=${API_URL}" \
            --env-var "apiKey=${{ env.API_KEY_VALUE }}" \
            --delay-request 200

      - name: Destroy Terraform-managed LocalStack Resources
        if: always()
        working-directory: terraform
        run: |
          terraform destroy -auto-approve -input=false \
            -var="use_localstack=true" \
            -var="localstack_endpoint=${{ env.LOCALSTACK_ENDPOINT }}" \
            -var="api_key_value=${{ env.API_KEY_VALUE }}"

      - name: Stop LocalStack
        if: always()
        run: docker compose -f docker-compose.localstack.yml --profile e2e-localstack down --remove-orphans

  # Deploys the stack to real AWS on every push to main, once validate + e2e-localstack pass.
  # Auth is GitHub OIDC → IAM role (bootstrap/), so no AWS keys are stored in GitHub.
  # Configuration lives in the `production` GitHub environment (see README "Deploy via GitHub
  # Actions"); until AWS_DEPLOY_ROLE_ARN is set there, the job skips the AWS steps and stays green.
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [validate, e2e-localstack]
    environment: production
    permissions:
      id-token: write
      contents: read
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      TF_VAR_aws_region: ${{ vars.AWS_REGION }}
      TF_VAR_api_key_value: ${{ secrets.API_KEY_VALUE }}
      TF_VAR_alert_email: ${{ vars.ALERT_EMAIL }}
      # -1 = no reserved concurrency. New AWS accounts start with a 10-execution account limit,
      # which leaves nothing to reserve (AWS keeps 10 unreserved). Once the account quota is
      # raised, set LAMBDA_RESERVED_CONCURRENCY in the production environment (e.g. 10).
      TF_VAR_lambda_reserved_concurrency: ${{ vars.LAMBDA_RESERVED_CONCURRENCY || '-1' }}
      TF_IN_AUTOMATION: "true"
    steps:
      - name: Check deploy configuration
        id: config
        env:
          ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
          HAS_API_KEY: ${{ secrets.API_KEY_VALUE != '' }}
        run: |
          if [ -z "$ROLE_ARN" ]; then
            echo "::notice title=Deploy skipped::AWS_DEPLOY_ROLE_ARN is not set in the production environment. See README → Deploy via GitHub Actions."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          missing=""
          [ -z "$AWS_REGION" ] && missing="$missing AWS_REGION"
          [ -z "$STATE_BUCKET" ] && missing="$missing TF_STATE_BUCKET"
          [ "$HAS_API_KEY" != "true" ] && missing="$missing API_KEY_VALUE(secret)"
          if [ -n "$missing" ]; then
            echo "::error title=Deploy misconfigured::Missing in the production environment:$missing"
            exit 1
          fi
          echo "enabled=true" >> "$GITHUB_OUTPUT"

      - name: Checkout
        if: steps.config.outputs.enabled == 'true'
        uses: actions/checkout@v5

      - name: Setup Node
        if: steps.config.outputs.enabled == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Build and Package Lambda zip
        if: steps.config.outputs.enabled == 'true'
        run: |
          npm ci
          npm run build
          cd dist && zip -rq lambdas.zip .

      - name: Configure AWS credentials (OIDC)
        if: steps.config.outputs.enabled == 'true'
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: gha-${{ github.run_id }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Setup Terraform
        if: steps.config.outputs.enabled == 'true'
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false

      # The S3 backend is only added here, at deploy time. Committing a backend block would
      # break the e2e-localstack job, which applies the same stack against LocalStack with
      # local state.
      - name: Terraform Init (S3 remote state)
        if: steps.config.outputs.enabled == 'true'
        working-directory: terraform
        env:
          STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
        run: |
          cat > ci_backend.tf <<'EOF'
          terraform {
            backend "s3" {}
          }
          EOF
          terraform init -input=false \
            -backend-config="bucket=${STATE_BUCKET}" \
            -backend-config="key=event-driven-notification-platform/terraform.tfstate" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"

      - name: Terraform Plan
        if: steps.config.outputs.enabled == 'true'
        working-directory: terraform
        shell: bash # bash -eo pipefail, so `| tee` keeps Terraform's exit code
        run: terraform plan -input=false -no-color -out=tfplan 2>&1 | tee plan.log

      - name: Terraform Apply
        if: steps.config.outputs.enabled == 'true'
        working-directory: terraform
        shell: bash # bash -eo pipefail, so `| tee` keeps Terraform's exit code
        run: terraform apply -input=false -no-color tfplan 2>&1 | tee apply.log

      # Surface each Terraform "Error:" block as a run annotation, so failures are readable
      # from the run summary / checks API without downloading the raw job log.
      - name: Report Terraform errors
        if: failure() && steps.config.outputs.enabled == 'true'
        working-directory: terraform
        run: |
          for f in plan.log apply.log; do
            [ -f "$f" ] || continue
            awk '{ gsub(/%/, "%25") }
                 /^Error: / { if (buf) print buf; buf = $0; n = 0; next }
                 buf && n < 15 { buf = buf "%0A" $0; n++ }
                 END { if (buf) print buf }' "$f" |
              while IFS= read -r block; do echo "::error title=Terraform ($f)::${block}"; done
          done

      - name: Smoke Test
        if: steps.config.outputs.enabled == 'true'
        env:
          API_KEY: ${{ secrets.API_KEY_VALUE }}
        run: |
          API_URL=$(terraform -chdir=terraform output -raw api_url)
          echo "API: ${API_URL}"
          code=$(curl -s -o /dev/null -w '%{http_code}' --retry 5 --retry-delay 5 --retry-all-errors \
            -H "x-api-key: ${API_KEY}" "${API_URL}/notifications")
          echo "GET /notifications with API key → ${code}"
          [ "$code" = "200" ] || { echo "::error::Expected 200, got ${code}"; exit 1; }
          code=$(curl -s -o /dev/null -w '%{http_code}' "${API_URL}/notifications")
          echo "GET /notifications without API key → ${code}"
          [ "$code" = "403" ] || { echo "::error::Expected 403 without API key, got ${code}"; exit 1; }
          echo "### Deployed :rocket:" >> "$GITHUB_STEP_SUMMARY"
          echo "API URL: ${API_URL}" >> "$GITHUB_STEP_SUMMARY"
